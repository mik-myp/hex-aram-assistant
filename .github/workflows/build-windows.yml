name: Build Windows (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows NSIS & Portable (.exe)
    runs-on: windows-latest

    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh latest ARAM Mayhem stats seed
        continue-on-error: true
        run: pnpm fetch-seed

      - name: Run TypeScript check and unit tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Build Windows Installer (NSIS) & Portable (.exe)
        run: pnpm dist:win

      - name: Upload Windows .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HexBuddy-Windows-Exe
          path: |
            release/*-Setup-*.exe
            release/*-Portable-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*-Setup-*.exe
            release/*-Portable-*.exe
            release/latest.yml
